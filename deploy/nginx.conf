# BloodLink reverse proxy (example). Replace bloodlink.example.com with your domain.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bloodlink
#   sudo ln -s /etc/nginx/sites-available/bloodlink /etc/nginx/sites-enabled/bloodlink
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is included inside the `http {}` block (sites-enabled/ or conf.d/).
# Security headers (CSP, HSTS, X-Frame-Options, ...) are set by the app itself in
# next.config.ts, so they are deliberately not repeated here.

upstream bloodlink_app {
  # docker-compose publishes the app on localhost only.
  server 127.0.0.1:3000;
  keepalive 32;
}

# Light per-IP limit for API routes (uploads, webhooks, auth callbacks). The app
# has its own per-user limits in MongoDB; this only absorbs floods.
limit_req_zone $binary_remote_addr zone=bloodlink_api:10m rate=10r/s;

# --- HTTP: ACME challenges for certbot, everything else to HTTPS -------------
server {
  listen 80;
  listen [::]:80;
  server_name bloodlink.example.com www.bloodlink.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://bloodlink.example.com$request_uri;
  }
}

# --- HTTPS: redirect www to the apex domain ---------------------------------
server {
  # "listen ... http2" works on every nginx version (Ubuntu 24.04 ships 1.24);
  # on nginx >= 1.25.1 you may switch to plain "listen 443 ssl;" plus "http2 on;".
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.bloodlink.example.com;

  ssl_certificate /etc/letsencrypt/live/bloodlink.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bloodlink.example.com/privkey.pem;

  return 301 https://bloodlink.example.com$request_uri;
}

# --- HTTPS: the application --------------------------------------------------
server {
  # "listen ... http2" works on every nginx version (Ubuntu 24.04 ships 1.24);
  # on nginx >= 1.25.1 you may switch to plain "listen 443 ssl;" plus "http2 on;".
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name bloodlink.example.com;

  # Certificates from: sudo certbot certonly --nginx -d bloodlink.example.com -d www.bloodlink.example.com
  ssl_certificate /etc/letsencrypt/live/bloodlink.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bloodlink.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:BloodLinkSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Uploads are capped at 5 MB by the app; allow for multipart overhead, reject the rest early.
  client_max_body_size 6m;
  client_body_timeout 30s;

  # Compression. Next.js already compresses its own responses; nginx leaves anything
  # with Content-Encoding alone, so this mainly covers responses Next.js didn't compress.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json
    application/manifest+json application/xml application/rss+xml image/svg+xml;

  # Brotli (requires the ngx_brotli module, e.g. the libnginx-mod-http-brotli-filter package):
  # brotli on;
  # brotli_comp_level 5;
  # brotli_types text/plain text/css text/xml application/javascript application/json
  #   application/manifest+json application/xml application/rss+xml image/svg+xml;

  # Shared proxy settings (inherited by every location below).
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
  # Stream React Server Component / Suspense output as it is produced.
  proxy_buffering off;
  proxy_request_buffering on;

  # The notification worker is driven by the cron container over the private Docker
  # network; it is never needed from the internet.
  location ^~ /api/internal/ {
    return 404;
  }

  # Content-hashed build assets never change: cache them for a year.
  location ^~ /_next/static/ {
    proxy_pass http://bloodlink_app;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  location ^~ /api/ {
    limit_req zone=bloodlink_api burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://bloodlink_app;
  }

  location / {
    proxy_pass http://bloodlink_app;
  }
}
